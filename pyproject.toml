[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waypoint-driver-manager"
version = "0.1.0"
description = "A more thoughtfully organized driver detection, sourcing, and install manager for Windows (with a cross-platform core)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chris Helo" }]

dependencies = []

[project.optional-dependencies]
windows = ["pywin32", "wmi"]
linux = ["pyudev"]
gui = ["PySide6"]
dev = ["pytest", "ruff"]

[project.scripts]
waypoint = "waypoint.cli.main:main"
waypoint-gui = "waypoint.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
