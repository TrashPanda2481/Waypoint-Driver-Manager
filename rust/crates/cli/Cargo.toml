[package]
name = "waypoint-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "waypoint_cli"
path = "src/lib.rs"

[[bin]]
name = "waypoint-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde_json.workspace = true
waypoint-core = { path = "../core" }
waypoint-engine = { path = "../engine" }
waypoint-platform = { path = "../platform" }

[dev-dependencies]
tempfile = "3"
