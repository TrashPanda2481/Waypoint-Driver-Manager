[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/sources",
    "crates/engine",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros", "serde"] }
sha2 = "0.10"
